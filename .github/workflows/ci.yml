name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Voxkey is a Windows app: the keyboard hook, DPAPI and the clipboard
    # paths all need a real Windows runner.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  build:
    # Proves the binary still builds, on every push. The artifact here is a
    # smoke test only - released binaries come from release.yml.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Voxkey-dev-build
          path: dist/Voxkey.exe
          retention-days: 7
